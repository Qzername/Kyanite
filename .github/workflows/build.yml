name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build App/Kyanite.Desktop/Kyanite.Desktop.csproj
      - run: dotnet test Kyanite.Modules.Tests/Kyanite.Modules.Tests.csproj
